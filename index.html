<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apps — precog software services</title>
<style>
  :root{--bg:#0e0f12;--card:#16181d;--line:#262a33;--ink:#e8e6e1;--mute:#8a8f9a;--live:#39d98a;--plan:#f5b841;--accent:#7aa2ff;
        font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}
  header{padding:40px 24px 16px;max-width:1100px;margin:0 auto}
  h1{margin:0;font-size:clamp(22px,4vw,34px);letter-spacing:-.02em;font-weight:600}
  h1 small{color:var(--mute);font-weight:400;font-size:.55em;margin-left:10px}
  p.sub{color:var(--mute);margin:8px 0 0;font-size:14px}
  main{max-width:1100px;margin:0 auto;padding:8px 24px 60px;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
  .card:hover{border-color:var(--accent)}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .name{font-size:17px;font-weight:600;margin:0}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap}
  .live{color:var(--live);border-color:var(--live)}.planned{color:var(--plan);border-color:var(--plan)}
  .desc{color:var(--mute);font-size:13px;line-height:1.5;margin:0;flex:1}
  .tags{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:11px;color:var(--mute);background:#1d2027;padding:2px 7px;border-radius:4px}
  .links{display:flex;gap:8px;margin-top:4px}
  a.btn{font-size:13px;text-decoration:none;padding:7px 12px;border-radius:6px;border:1px solid var(--line);color:var(--ink)}
  a.btn.primary{background:var(--accent);border-color:var(--accent);color:#0b0d12;font-weight:600}
  a.btn[aria-disabled="true"]{opacity:.35;pointer-events:none}
  footer{max-width:1100px;margin:0 auto;padding:0 24px 40px;color:var(--mute);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>apps<small>precogsoftwareservices.com</small></h1>
  <p class="sub">Playable web apps and experiments, built and deployed by a Claude agent on an always-on EC2 hub.</p>
</header>
<main id="grid"></main>
<footer id="foot"></footer>
<script>
(async()=>{
  const r=await fetch('./apps.json?'+Date.now());const apps=await r.json();
  const g=document.getElementById('grid');
  const order={live:0,planned:1};
  apps.sort((a,b)=>(order[a.status]??9)-(order[b.status]??9)||a.name.localeCompare(b.name));
  for(const a of apps){
    const el=document.createElement('article');el.className='card';
    el.innerHTML=`
      <div class="top"><h2 class="name">${a.name}</h2><span class="badge ${a.status}">${a.status}</span></div>
      <p class="desc">${a.desc||''}</p>
      <div class="tags">${(a.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="links">
        <a class="btn primary" href="${a.url||'#'}" aria-disabled="${a.url?'false':'true'}">${a.url?'Open':'Not yet live'}</a>
        <a class="btn" href="${a.repo||'#'}" aria-disabled="${a.repo?'false':'true'}">${a.repo?'GitHub':'Private'}</a>
      </div>`;
    g.appendChild(el);
  }
  const live=apps.filter(a=>a.status==='live').length;
  document.getElementById('foot').textContent=`${live} live · ${apps.length-live} planned · updated ${new Date().toISOString().slice(0,10)}`;
})();
</script>
</body>
</html>
