<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apps — precog software services</title>
<style>
  :root{--bg:#0e0f12;--card:#16181d;--line:#262a33;--ink:#e8e6e1;--mute:#8a8f9a;--live:#39d98a;--plan:#f5b841;--accent:#7aa2ff;
        font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}
  header{padding:40px 24px 16px;max-width:820px;margin:0 auto}
  h1{margin:0;font-size:clamp(22px,4vw,34px);letter-spacing:-.02em;font-weight:600}
  h1 small{color:var(--mute);font-weight:400;font-size:.55em;margin-left:10px}
  p.sub{color:var(--mute);margin:8px 0 0;font-size:14px}
  main{max-width:820px;margin:0 auto;padding:8px 24px 60px;display:flex;flex-direction:column;gap:8px}

  /* one row per app */
  .row{background:var(--card);border:1px solid var(--line);border-radius:10px;transition:border-color .15s}
  .row:hover,.row.open{border-color:var(--accent)}
  .head{display:flex;align-items:stretch;gap:8px;padding:4px}
  .rowbtn{flex:1 1 auto;min-width:0;display:flex;align-items:flex-start;gap:10px;
          background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;
          padding:12px;border-radius:7px}
  .rowbtn:hover{background:#1b1e25}
  .rowbtn:focus-visible,.open:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chev{flex:0 0 auto;width:10px;height:10px;margin-top:6px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);
        transform:rotate(-45deg);transition:transform .15s,border-color .15s}
  .row.open .chev{transform:rotate(45deg);border-color:var(--accent)}
  .text{min-width:0;display:flex;flex-direction:column;gap:4px}
  .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .name{font-size:16px;font-weight:600}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap}
  .live{color:var(--live);border-color:var(--live)}.planned{color:var(--plan);border-color:var(--plan)}
  .building{color:var(--accent);border-color:var(--accent)}
  /* the row blurb is one line; the full text lives in the detail */
  .desc{color:var(--mute);font-size:13px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  a.open{flex:0 0 auto;align-self:center;display:flex;align-items:center;
         text-decoration:none;font-size:13px;font-weight:600;padding:10px 18px;border-radius:7px;
         background:var(--accent);border:1px solid var(--accent);color:#0b0d12}
  a.open:hover{filter:brightness(1.1)}
  a.open[aria-disabled="true"]{background:none;color:var(--mute);border-color:var(--line);pointer-events:none}

  /* detail, expanded in place */
  .detail{border-top:1px solid var(--line);margin:0 4px}
  .detail-inner{padding:14px 12px 16px 34px;display:flex;flex-direction:column;gap:12px}
  .full{margin:0;color:var(--ink);font-size:13px;line-height:1.6;opacity:.9}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11px;color:var(--mute);background:#1d2027;padding:2px 7px;border-radius:4px}
  dl.meta{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px;align-items:center}
  dl.meta dt{color:var(--mute)}
  dl.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
  a.meta-link{color:var(--accent);text-decoration:none}
  a.meta-link:hover{text-decoration:underline}
  .mute{color:var(--mute)}
  .error{color:var(--plan);font-size:13px}
  footer{max-width:820px;margin:0 auto;padding:0 24px 40px;color:var(--mute);font-size:12px}

  @media(max-width:520px){
    .head{flex-direction:column;gap:0;padding:4px 4px 8px}
    .rowbtn{padding:12px 10px 8px}
    a.open{align-self:stretch;justify-content:center;margin:0 10px}
    .desc{white-space:normal}
    .detail-inner{padding:14px 12px 16px 12px}
  }
</style>
</head>
<body>
<header>
  <h1>apps<small>precogsoftwareservices.com</small></h1>
  <p class="sub">Playable web apps and experiments, built and deployed by a Claude agent on an always-on EC2 hub. Tap a row for detail.</p>
</header>
<main id="list"></main>
<footer id="foot"></footer>
<script src="./app.js"></script>
<script>Dashboard.init();</script>
</body>
</html>
